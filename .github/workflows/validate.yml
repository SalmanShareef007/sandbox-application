name: Build & Push Images to ACR

on:
  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer to release to (for example xencia or harris). Images go to <customer>/sandbox-*'
        required: true
        type: string

permissions:
  contents: read

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  CUSTOMER: ${{ inputs.customer }}

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare image names
        run: |
          customer="$(echo "$CUSTOMER" | tr '[:upper:]' '[:lower:]')"
          if ! echo "$customer" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'; then
            echo "Customer must be lowercase letters, digits or hyphens." >&2
            exit 1
          fi
          registry="${ACR_NAME}.azurecr.io/${customer}"
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"

      - name: Login to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_NAME.azurecr.io" \
            --username "$ACR_USERNAME" --password-stdin

      - name: Build Backend API image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -f Backend/Dockerfile --target api \
            -t "$REGISTRY/sandbox-api:${{ github.run_id }}" \
            -t "$REGISTRY/sandbox-api:latest" .

      - name: Build Backend Worker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -f Backend/Dockerfile --target worker \
            -t "$REGISTRY/sandbox-worker:${{ github.run_id }}" \
            -t "$REGISTRY/sandbox-worker:latest" .

      # The UI image is generic: sign-in values are read from the App Service environment at startup.
      - name: Build Frontend UI image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -f Frontend/Dockerfile \
            -t "$REGISTRY/sandbox-ui:${{ github.run_id }}" \
            -t "$REGISTRY/sandbox-ui:latest" \
            Frontend

      - name: Push images to ACR
        run: |
          for image in sandbox-api sandbox-worker sandbox-ui; do
            docker push "$REGISTRY/$image:${{ github.run_id }}"
            docker push "$REGISTRY/$image:latest"
          done
